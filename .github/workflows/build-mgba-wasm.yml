name: Build libretro mGBA WASM

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ Setup Emscripten
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        actions-cache-folder: emsdk-cache

    # 3️⃣ Clone libretro mGBA
    - name: Clone libretro mGBA
      run: |
        git clone https://github.com/libretro/mgba.git
        cd mgba
        git submodule update --init --recursive

    # 4️⃣ Build libretro core (emscripten)
    - name: Build libretro core (emscripten)
      run: |
        cd mgba
        make -f Makefile.libretro \
          platform=emscripten \
          CC=emcc \
          CXX=em++ \
          AR=emar \
          RANLIB=emranlib \
          STRIP=llvm-strip \
          HAVE_OPENGL=0 \
          HAVE_OPENGLES=0 \
          HAVE_SDL=0 \
          HAVE_THREADS=0 \
          HAVE_PTHREADS=0 \
          HAVE_NETWORKING=0 \
          HAVE_FFMPEG=0 \
          HAVE_MMAP=0 \
          HAVE_DYNAREC=0 \
          HAVE_ZLIB=1

    # 5️⃣ Debug: xác nhận file core được tạo
    - name: Locate libretro output
      run: |
        cd mgba
        echo "==== Files in mgba ===="
        ls -lh
        echo "==== libretro core candidates ===="
        find . -maxdepth 1 -type f | grep libretro || true

    # 6️⃣ Link WASM + JS (CỰC KỲ QUAN TRỌNG)
    - name: Link WASM + JS
      run: |
        cd mgba

        CORE=mgba_libretro_emscripten.bc

        if [ ! -f "$CORE" ]; then
          echo "❌ Core file not found: $CORE"
          exit 1
        fi

        echo "Using core file: $CORE"
        head -c 8 "$CORE" || true

        emcc \
          -O3 \
          -s WASM=1 \
          -s MODULARIZE=1 \
          -s EXPORT_ES6=1 \
          -s LEGACY_RUNTIME=1 \
          -s ALLOW_MEMORY_GROWTH=1 \
          -s ALLOW_TABLE_GROWTH=1 \
          -s ENVIRONMENT=web \
          -s EXPORTED_RUNTIME_METHODS='[
            "addFunction",
            "removeFunction",
            "cwrap",
            "ccall",
            "FS",
            "HEAPU8",
            "HEAP32"
          ]' \
          -s EXPORTED_FUNCTIONS='[
            "_retro_init",
            "_retro_deinit",
            "_retro_run",
            "_retro_load_game",
            "_retro_unload_game",
            "_retro_set_environment",
            "_retro_set_video_refresh",
            "_retro_set_audio_sample",
            "_retro_set_audio_sample_batch",
            "_retro_set_input_poll",
            "_retro_set_input_state",
            "_malloc",
            "_free"
          ]' \
          -Wl,--whole-archive \
          "$CORE" \
          -Wl,--no-whole-archive \
          -o mgba.js

    # 7️⃣ Upload artifacts
    - name: Upload WASM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mgba-wasm
        path: |
          mgba/mgba.js
          mgba/mgba.wasm
