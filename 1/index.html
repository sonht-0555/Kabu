<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mGBA libretro WASM</title>
  <style>
    canvas {
      image-rendering: pixelated;
      width: 480px;
      height: 320px;
      border: 1px solid #000;
    }
  </style>
</head>
<body>

<input type="file" id="rom" accept=".gba">
<br><br>
<canvas id="screen" width="240" height="160"></canvas>

<script src="mgba.js"></script>
<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const imageData = ctx.createImageData(240, 160);

Module.onRuntimeInitialized = () => {
  console.log("WASM ready");

  // === callbacks ===
  const videoCb = Module.addFunction((data, w, h, pitch) => {
    const src = Module.HEAPU8.subarray(data, data + h * pitch);
    for (let y = 0; y < h; y++) {
      imageData.data.set(
        src.subarray(y * pitch, y * pitch + w * 4),
        y * w * 4
      );
    }
    ctx.putImageData(imageData, 0, 0);
  }, "viiii");

  Module._retro_set_video_refresh(videoCb);
  Module._retro_init();

  document.getElementById("rom").onchange = async e => {
    const file = e.target.files[0];
    const buf = new Uint8Array(await file.arrayBuffer());

    Module.FS_createDataFile("/", "game.gba", buf, true, true);

    const gameInfo = Module._malloc(12);
    Module.HEAP32[gameInfo >> 2] = Module.allocateUTF8("/game.gba");
    Module.HEAP32[(gameInfo >> 2) + 1] = 0;
    Module.HEAP32[(gameInfo >> 2) + 2] = 0;

    Module._retro_load_game(gameInfo);

    function frame() {
      Module._retro_run();
      requestAnimationFrame(frame);
    }
    frame();
  };
};
</script>

</body>
</html>
