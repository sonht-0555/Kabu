<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>mGBA WASM test</title>
<style>
  body { background:#111; color:#eee; text-align:center; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>

<h2>mGBA libretro WASM</h2>
<input type="file" id="rom" accept=".gba"><br><br>
<canvas id="screen" width="240" height="160"></canvas>

<script type="module">
import ModuleFactory from './mgba.js';

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(240, 160);

function video_cb(data, width, height, pitch) {
  const src = Module.HEAPU8.subarray(data, data + height * pitch);
  let p = 0;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width * 4; x++) {
      img.data[p++] = src[y * pitch + x];
    }
  }
  ctx.putImageData(img, 0, 0);
}

const Module = await ModuleFactory({
  canvas
});

/* === libretro callbacks === */
Module._retro_set_environment(() => 1);
Module._retro_set_video_refresh(video_cb);
Module._retro_set_audio_sample(() => {});
Module._retro_set_audio_sample_batch(() => 0);
Module._retro_set_input_poll(() => {});
Module._retro_set_input_state(() => 0);

Module._retro_init();

/* === Load ROM === */
document.getElementById('rom').onchange = async e => {
  const file = e.target.files[0];
  const data = new Uint8Array(await file.arrayBuffer());

  Module.FS_createDataFile('/', 'game.gba', data, true, true);

  const game = Module._malloc(8);
  Module.setValue(game, Module.allocateUTF8('/game.gba'), '*');

  Module._retro_load_game(game);

  function frame() {
    Module._retro_run();
    requestAnimationFrame(frame);
  }
  frame();
};
</script>

</body>
</html>
