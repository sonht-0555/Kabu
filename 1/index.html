<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>mGBA WASM</title>
<style>
body { background:#111; color:#fff; text-align:center }
canvas {
  width:480px;
  height:320px;
  image-rendering: pixelated;
}
</style>
</head>
<body>

<h3>mGBA WASM</h3>
<canvas id="screen" width="240" height="160"></canvas><br><br>
<input type="file" id="rom" accept=".gba">

<script>
// ===== Audio - ScriptProcessor + FIFO (audio-driven) =====
var audioContext = null;
var scriptProcessor = null;
var isRunning = false;

const AUDIO_BLOCK_SIZE = 1024;
const AUDIO_FIFO_MAXLEN = 8192;
var audioFifo0 = new Int16Array(AUDIO_FIFO_MAXLEN);
var audioFifo1 = new Int16Array(AUDIO_FIFO_MAXLEN);
var audioFifoHead = 0;
var audioFifoCnt = 0;

// Core outputs ~1096 samples/frame at 65760 Hz effective rate
// Browser wants 48000 Hz
// Resample ratio: consume more samples from core to match browser rate
const CORE_RATE = 65760; // 1096 * 60
const BROWSER_RATE = 48000;
const RESAMPLE_RATIO = CORE_RATE / BROWSER_RATE; // ~1.37

// Debug
var frameCnt = 0;
var lastDebugTime = 0;
var samplesPerFrame = 0;

function initAudio() {
  if (audioContext) {
    if (audioContext.state != 'running') audioContext.resume();
    return;
  }
  audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  console.log('🔊 sampleRate:', audioContext.sampleRate);
  scriptProcessor = audioContext.createScriptProcessor(AUDIO_BLOCK_SIZE, 0, 2);
  scriptProcessor.onaudioprocess = processAudio;
  scriptProcessor.connect(audioContext.destination);
  audioContext.resume();
  lastDebugTime = performance.now();
}

function processAudio(event) {
  var audioData0 = event.outputBuffer.getChannelData(0);
  var audioData1 = event.outputBuffer.getChannelData(1);

  if (!isRunning) {
    for (var i = 0; i < AUDIO_BLOCK_SIZE; i++) {
      audioData0[i] = 0;
      audioData1[i] = 0;
    }
    return;
  }
  
  // Need more samples from core to resample down
  var neededSamples = Math.ceil(AUDIO_BLOCK_SIZE * RESAMPLE_RATIO); // ~1403
  
  // Audio-driven: run frames until we have enough audio
  while (audioFifoCnt < neededSamples) {
    Module._retro_run();
    frameCnt++;
  }
  
  // Log every 60 frames
  if (frameCnt % 60 === 0) {
    var now = performance.now();
    var fps = 60000 / (now - lastDebugTime);
    console.log(`📊 FPS: ${fps.toFixed(1)}, FIFO: ${audioFifoCnt}, samples/frame: ${samplesPerFrame}`);
    lastDebugTime = now;
  }

  // Resample from 65760Hz to 48000Hz (downsample)
  for (var i = 0; i < AUDIO_BLOCK_SIZE; i++) {
    var srcPos = i * RESAMPLE_RATIO;
    var srcIdx = Math.floor(srcPos);
    var frac = srcPos - srcIdx;
    var idx = (audioFifoHead + srcIdx) % AUDIO_FIFO_MAXLEN;
    var idx2 = (audioFifoHead + srcIdx + 1) % AUDIO_FIFO_MAXLEN;
    
    audioData0[i] = (audioFifo0[idx] * (1 - frac) + audioFifo0[idx2] * frac) / 32768.0;
    audioData1[i] = (audioFifo1[idx] * (1 - frac) + audioFifo1[idx2] * frac) / 32768.0;
  }
  
  // Consume resampled samples
  var consumed = Math.floor(AUDIO_BLOCK_SIZE * RESAMPLE_RATIO);
  audioFifoHead = (audioFifoHead + consumed) % AUDIO_FIFO_MAXLEN;
  audioFifoCnt -= consumed;
}

function writeAudio(ptr, frames) {
  samplesPerFrame = frames; // Track for debug
  if (!audioContext) return frames;
  var data = new Int16Array(Module.HEAPU8.buffer, ptr, frames * 2);
  var tail = (audioFifoHead + audioFifoCnt) % AUDIO_FIFO_MAXLEN;
  
  if (audioFifoCnt + frames >= AUDIO_FIFO_MAXLEN) return frames;
  
  for (var i = 0; i < frames; i++) {
    audioFifo0[tail] = data[i * 2];
    audioFifo1[tail] = data[i * 2 + 1];
    tail = (tail + 1) % AUDIO_FIFO_MAXLEN;
  }
  audioFifoCnt += frames;
  return frames;
}

// ===== Module =====
var Module = {
  canvas: document.getElementById("screen"),

  onRuntimeInitialized() {
    console.log("✅ runtime ready");

    const envPtr    = Module.addFunction(env_cb, "iii");
    const videoPtr  = Module.addFunction(video_cb, "viiii");
    const audioPtr  = Module.addFunction(audio_cb, "vii");
    const audioBPtr = Module.addFunction(audio_batch_cb, "iii");
    const pollPtr   = Module.addFunction(input_poll_cb, "v");
    const statePtr  = Module.addFunction(input_state_cb, "iiiii");

    Module._retro_set_environment(envPtr);
    Module._retro_set_video_refresh(videoPtr);
    Module._retro_set_audio_sample(audioPtr);
    Module._retro_set_audio_sample_batch(audioBPtr);
    Module._retro_set_input_poll(pollPtr);
    Module._retro_set_input_state(statePtr);

    Module._retro_init();
    console.log("🎮 retro_init done");
  }
};

// ===== libretro callbacks =====

function env_cb(cmd, data) { return 0; }

function video_cb(ptr, w, h, pitch) {
  const ctx = Module.canvas.getContext("2d");
  const img = ctx.getImageData(0, 0, w, h);
  const imageData = img.data;
  
  console.log(`video_cb: w=${w}, h=${h}, pitch=${pitch}`);
  
  const pixelData = new Uint16Array(Module.HEAPU8.buffer, ptr, (pitch / 2) * h);
  const gameStride = pitch / 2;
  
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const srcIndex = y * gameStride + x;
      const destIndex = (y * w + x) * 4;
      const color = pixelData[srcIndex];
      
      // mGBA outputs RGB565 format (16-bit color)
      const r = (color >> 11) & 0x1F;  // 5 bits red (bits 15-11)
      const g = (color >> 5) & 0x3F;   // 6 bits green (bits 10-5)  
      const b = color & 0x1F;          // 5 bits blue (bits 4-0)
      
      // Convert to 8-bit RGB
      imageData[destIndex] = (r << 3) | (r >> 2);     // Red 5→8 bit
      imageData[destIndex + 1] = (g << 2) | (g >> 4); // Green 6→8 bit
      imageData[destIndex + 2] = (b << 3) | (b >> 2); // Blue 5→8 bit
      imageData[destIndex + 3] = 255;                  // Alpha
    }
  }
  
  ctx.putImageData(img, 0, 0);
}

function audio_cb(left, right) {
  // Disabled - using audio_batch_cb only
}

function audio_batch_cb(ptr, frames) {
  return writeAudio(ptr, frames);
}

function input_poll_cb() {}
function input_state_cb() { return 0; }

// ===== ROM loader (DATA MODE) =====

document.getElementById("rom").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // Init audio on user gesture
  initAudio();

  const rom = new Uint8Array(await file.arrayBuffer());
  const romPtr = Module._malloc(rom.length);
  Module.HEAPU8.set(rom, romPtr);

  // struct retro_game_info
  // { path, data, size, meta }
  const info = Module._malloc(16);
  Module.HEAPU32[(info >> 2) + 0] = 0;
  Module.HEAPU32[(info >> 2) + 1] = romPtr;
  Module.HEAPU32[(info >> 2) + 2] = rom.length;
  Module.HEAPU32[(info >> 2) + 3] = 0;

  const ok = Module._retro_load_game(info);
  console.log("🎯 load game:", ok);

  isRunning = true;
  lastDebugTime = performance.now();
  // Game loop is audio-driven via processAudio
};
</script>

<script src="./mgba.js"></script>
</body>
</html>
