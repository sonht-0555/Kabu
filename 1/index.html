<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>mGBA WASM</title>
<style>
body { background:#111; color:#fff; text-align:center }
canvas {
  width:480px;
  height:320px;
  image-rendering: pixelated;
}
</style>
</head>
<body>

<h3>mGBA WASM</h3>
<canvas id="screen" width="240" height="160"></canvas><br><br>
<input type="file" id="rom" accept=".gba">

<script>
// ===== Audio - AudioBufferSourceNode Scheduling =====
var audioContext = null;
var nextPlayTime = 0;

// Sample rate calibration
var coreSampleRate = 32768; // Will be measured
var sampleRateCalibrated = false;
const BATCH_SIZE = 2048;

// Pre-allocated buffers
var bufferL = new Float32Array(BATCH_SIZE);
var bufferR = new Float32Array(BATCH_SIZE);
var bufferPos = 0;

function initAudio() {
  if (audioContext) {
    // iOS needs resume on every user gesture
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    return;
  }
  
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    // iOS: unlock audio with silent buffer
    var silentBuffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
    var source = audioContext.createBufferSource();
    source.buffer = silentBuffer;
    source.connect(audioContext.destination);
    source.start(0);
    
    audioContext.resume();
    nextPlayTime = audioContext.currentTime;
    console.log("🔊 Audio initialized: " + audioContext.sampleRate + "Hz");
  } catch (e) {
    console.error("Audio init error:", e);
  }
}

function flushAudio() {
  if (!audioContext || bufferPos === 0) return;
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  
  // Use browser's sample rate and let it handle resampling
  // coreSampleRate may be non-standard (like 61630Hz) which iOS doesn't support
  var outputRate = audioContext.sampleRate;
  var ratio = coreSampleRate / outputRate;
  var outputLen = Math.ceil(bufferPos / ratio);
  
  var buffer = audioContext.createBuffer(2, outputLen, outputRate);
  var outL = buffer.getChannelData(0);
  var outR = buffer.getChannelData(1);
  
  // Simple linear interpolation resample
  for (var i = 0; i < outputLen; i++) {
    var srcPos = i * ratio;
    var srcIdx = Math.floor(srcPos);
    var frac = srcPos - srcIdx;
    
    if (srcIdx + 1 < bufferPos) {
      outL[i] = bufferL[srcIdx] * (1 - frac) + bufferL[srcIdx + 1] * frac;
      outR[i] = bufferR[srcIdx] * (1 - frac) + bufferR[srcIdx + 1] * frac;
    } else if (srcIdx < bufferPos) {
      outL[i] = bufferL[srcIdx];
      outR[i] = bufferR[srcIdx];
    }
  }
  
  var source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  
  var now = audioContext.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;
  
  source.start(nextPlayTime);
  nextPlayTime += buffer.duration;
  
  bufferPos = 0;
}

function writeAudio(ptr, frames) {
  if (!audioContext) return frames;
  
  var int16Data = new Int16Array(Module.HEAPU8.buffer, ptr, frames * 2);
  
  // Calibrate sample rate after 1 second
  if (!sampleRateCalibrated) {
    if (!writeAudio.count) {
      writeAudio.count = 0;
      writeAudio.startTime = performance.now();
    }
    writeAudio.count += frames;
    var elapsed = (performance.now() - writeAudio.startTime) / 1000;
    if (elapsed >= 1) {
      coreSampleRate = Math.round(writeAudio.count / elapsed);
      sampleRateCalibrated = true;
    }
  }
  
  for (var i = 0; i < frames; i++) {
    bufferL[bufferPos] = int16Data[i * 2] / 32768.0;
    bufferR[bufferPos] = int16Data[i * 2 + 1] / 32768.0;
    bufferPos++;
    
    if (bufferPos >= BATCH_SIZE) {
      flushAudio();
    }
  }
  
  return frames;
}

// ===== Module =====
var Module = {
  canvas: document.getElementById("screen"),

  onRuntimeInitialized() {
    console.log("✅ runtime ready");

    const envPtr    = Module.addFunction(env_cb, "iii");
    const videoPtr  = Module.addFunction(video_cb, "viiii");
    const audioPtr  = Module.addFunction(audio_cb, "vii");
    const audioBPtr = Module.addFunction(audio_batch_cb, "iii");
    const pollPtr   = Module.addFunction(input_poll_cb, "v");
    const statePtr  = Module.addFunction(input_state_cb, "iiiii");

    Module._retro_set_environment(envPtr);
    Module._retro_set_video_refresh(videoPtr);
    Module._retro_set_audio_sample(audioPtr);
    Module._retro_set_audio_sample_batch(audioBPtr);
    Module._retro_set_input_poll(pollPtr);
    Module._retro_set_input_state(statePtr);

    Module._retro_init();
    console.log("🎮 retro_init done");
  }
};

// ===== libretro callbacks =====

function env_cb(cmd, data) { return 0; }

function video_cb(ptr, w, h, pitch) {
  const ctx = Module.canvas.getContext("2d");
  const img = ctx.getImageData(0, 0, w, h);
  const imageData = img.data;
  
  console.log(`video_cb: w=${w}, h=${h}, pitch=${pitch}`);
  
  const pixelData = new Uint16Array(Module.HEAPU8.buffer, ptr, (pitch / 2) * h);
  const gameStride = pitch / 2;
  
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const srcIndex = y * gameStride + x;
      const destIndex = (y * w + x) * 4;
      const color = pixelData[srcIndex];
      
      // mGBA outputs RGB565 format (16-bit color)
      const r = (color >> 11) & 0x1F;  // 5 bits red (bits 15-11)
      const g = (color >> 5) & 0x3F;   // 6 bits green (bits 10-5)  
      const b = color & 0x1F;          // 5 bits blue (bits 4-0)
      
      // Convert to 8-bit RGB
      imageData[destIndex] = (r << 3) | (r >> 2);     // Red 5→8 bit
      imageData[destIndex + 1] = (g << 2) | (g >> 4); // Green 6→8 bit
      imageData[destIndex + 2] = (b << 3) | (b >> 2); // Blue 5→8 bit
      imageData[destIndex + 3] = 255;                  // Alpha
    }
  }
  
  ctx.putImageData(img, 0, 0);
}

function audio_cb(left, right) {
  // Disabled - using audio_batch_cb only
}

function audio_batch_cb(ptr, frames) {
  return writeAudio(ptr, frames);
}

function input_poll_cb() {}
function input_state_cb() { return 0; }

// ===== ROM loader (DATA MODE) =====

document.getElementById("rom").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // Init audio on user gesture
  initAudio();

  const rom = new Uint8Array(await file.arrayBuffer());
  const romPtr = Module._malloc(rom.length);
  Module.HEAPU8.set(rom, romPtr);

  // struct retro_game_info
  // { path, data, size, meta }
  const info = Module._malloc(16);
  Module.HEAPU32[(info >> 2) + 0] = 0;
  Module.HEAPU32[(info >> 2) + 1] = romPtr;
  Module.HEAPU32[(info >> 2) + 2] = rom.length;
  Module.HEAPU32[(info >> 2) + 3] = 0;

  const ok = Module._retro_load_game(info);
  console.log("🎯 load game:", ok);

  // GBA runs at 59.7275 fps
  const TARGET_FPS = 59.7275;
  const FRAME_TIME = 1000 / TARGET_FPS;
  var lastFrameTime = performance.now();

  function loop() {
    var now = performance.now();
    var elapsed = now - lastFrameTime;
    
    if (elapsed >= FRAME_TIME) {
      lastFrameTime = now - (elapsed % FRAME_TIME);
      Module._retro_run();
    }
    
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
</script>

<script src="./mgba.js"></script>
</body>
</html>
