<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SVG Path → clip-path: polygon()</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      line-height: 1.5;
    }
    textarea, input {
      width: 100%;
      font-family: monospace;
      font-size: 14px;
      padding: 8px;
      margin: 6px 0;
      box-sizing: border-box;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    pre {
      background: #f6f6f6;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>SVG Path → clip-path: polygon()</h2>
  <label>Path SVG (thuộc tính <code>d</code>):</label>
  <textarea id="path" rows="6" placeholder='Ví dụ: M176 0V175H175V174H174Z'></textarea>

  <label>Chiều rộng gốc (width):</label>
  <input id="w" type="number" value="176">

  <label>Chiều cao gốc (height):</label>
  <input id="h" type="number" value="175">

  <button id="convert">Convert</button>

  <h3>Kết quả:</h3>
  <pre id="output"></pre>

  <script>
    document.getElementById("convert").onclick = () => {
      const path = document.getElementById("path").value.trim();
      const width = parseFloat(document.getElementById("w").value);
      const height = parseFloat(document.getElementById("h").value);
      if (!path || !width || !height) {
        alert("Hãy nhập đủ path, width, height!");
        return;
      }

      let x = 0, y = 0;
      const coords = [];
      path.replace(/([MLHVZ])([^MLHVZ]*)/gi, (_, cmd, args) => {
        const nums = args.trim().split(/[\s,]+/).filter(Boolean).map(Number);
        switch (cmd.toUpperCase()) {
          case "M":
          case "L":
            for (let i = 0; i < nums.length; i += 2) {
              x = nums[i];
              y = nums[i + 1];
              coords.push([x, y]);
            }
            break;
          case "H":
            nums.forEach(n => { x = n; coords.push([x, y]); });
            break;
          case "V":
            nums.forEach(n => { y = n; coords.push([x, y]); });
            break;
        }
      });

      const polygon = coords
        .map(([px, py]) => `${(px / width * 100)}% ${(py / height * 100)}%`)
        .join(", ");
      document.getElementById("output").textContent = `clip-path: polygon(${polygon});`;
    };
  </script>
</body>
</html>
