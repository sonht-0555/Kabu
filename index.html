<!DOCTYPE html>
<html lang="vi">
<head>
  <title>New UI</title>
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-title" content="Kabu" />
  <link rel="stylesheet" type="text/css" href="./src/css/new.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <page01>
    <list></list>
    <cta>
      <logo></logo>
      <setting></setting>
      <vertical>
        <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
          <rect id="k0"   x="22" y="18" width="6" height="2" rx="0.3" fill="var(--profile-3)"/>
          <rect id="k80"  x="22" y="24" width="6" height="2" rx="0.3" fill="var(--profile-3)"/>
          <rect id="k160" x="22" y="30" width="6" height="2" rx="0.3" fill="var(--profile-3)"/>
        </svg>
      </vertical>
      <input type="file" id="romInput" hidden />
      <label for="romInput" id="fileInputLable"></label>
    </cta>
  </page01>
  <page02 hidden>
    <display>
      <canvas></canvas>
      <notif>
        <svg width="15" height="10" viewBox="0 0 15 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="5" width="2" height="3" rx="0.2" fill="var(--profile-3)"/>
          <rect x="5" y="5" width="2" height="3" rx="0.2" fill="var(--profile-6)"/>
          <rect x="9" y="5" width="2" height="3" rx="0.2" fill="var(--profile-6)"/>
        </svg>
        <titles>Riviera_The Promised Land.zip</titles>
        <times>0h00.00</times>
      </notif>
    </display>
    <divide></divide>
    <gamepad>
      <state-button></state-button>
      <l-button id="l"></l-button>
      <r-button id="r"></r-button>
      <menu-button></menu-button>
      <dpad-section>
        <svg width="100%" height="100%" viewBox="0 0 100 100" fill-opacity="0">
          <polygon points="50 50, 100 100, 100 0"   fill="transparent" id="right"/>
          <polygon points="0 0, 0 100, 50 50"       fill="transparent" id="left"/>
          <polygon points="0 0, 100 0, 50 50"       fill="transparent" id="up"/>
          <polygon points="0 100, 100 100, 50 50"   fill="transparent" id="down"/>
          <polygon points="0 0, 25 0, 0 25"         fill="transparent" id="up-left"/>
          <polygon points="75 0, 100 0, 100 25"     fill="transparent" id="up-right"/>
          <polygon points="0 75, 25 100, 0 100"     fill="transparent" id="down-left"/>
          <polygon points="100 75, 100 100, 75 100" fill="transparent" id="down-right"/>
        </svg>
      </dpad-section>
      <a-button id="a"></a-button>
      <wrap-button></wrap-button>
      <b-button id="b"></b-button>
      <f-button></f-button>
      <select-button id="select"></select-button>
      <start-button id="start"></start-button>
    </gamepad>
    <joypad></joypad>
  </page02>
</body>
<script type="" src="./src/js/s-global.js"></script>
<script type="module" src="./src/js/s-main.js"></script>
<script type="module" src="./src/js/page01.js"></script> 
<script type="module" src="./src/js/page02.js"></script> 
</html>
