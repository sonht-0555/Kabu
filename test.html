<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Mask with 1px Image</title>
<style>
body {
  background: #111;
  display: flex;
  justify-content: center;
  height: 100vh;
}

/* --- vùng demo --- */
.texture-box {
  width: 400px;
  height: 200px;
  background: url("data:image/svg+xml,%3Csvg width='1' height='1' viewBox='0 0 1 1' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0.333333 0.333333H0.666667V0.666667H0.333333V0.333333Z' fill='%2320A5A6'/%3E%3Cpath d='M0.666667 0H1V0.333333H0.666667V0Z' fill='%2320A5A6'/%3E%3Cpath d='M0 0.666667H0.333333V1H0V0.666667Z' fill='%2320A5A6'/%3E%3C/svg%3E%0A");
  background-size: auto;
  mask-image: linear-gradient(90deg,rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 100%);
  mask-repeat: no-repeat;
}
</style>
</head>
<body>
  <div class="texture-box"></div>
</body>
</html>
