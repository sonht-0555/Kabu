<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Background Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            gap: 40px;
        }

        .box {
            width: 50px;       /* Kích thước hiển thị */
            height: 50px;
            border: 2px solid #333;
            background-repeat: no-repeat;
            background-size: cover; /* Phóng to SVG 1x1 để lấp đầy box */
        }
    </style>
</head>
<body>

    <div>
        <h2>N = 4 Rects</h2>
        <div id="box-n4" class="box"></div>
    </div>

    <div>
        <h2>N = 3 Rects</h2>
        <div id="box-n3" class="box"></div>
    </div>

    <script>
        // Hàm tạo chuỗi SVG Data URI đã mã hóa tối thiểu
        function createSimpleSvgBackground(N) {
            if (N <= 0) return '';
            const rects = [];
            const size = 1 / N; 
            for (let i = 0; i < N; i++) {
                const x = (i * size).toFixed(3); 
                const y = ((N - 1 - i) * size).toFixed(3); 
                const size_str = size.toFixed(3);
                const rectString = `<rect x='${x}' y='${y}' width='${size_str}' height='${size_str}' fill='black'/>`;
                rects.push(rectString);
            }
            const svgContent = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'>${rects.join('')}</svg>`;
            let encodedSvg = svgContent
                .replace(/'/g, '"').replace(/#/g, '%23').replace(/"/g, "'"); 
            return `url("data:image/svg+xml,${encodedSvg}")`;
        }

        // --- Áp dụng Background cho các DIV ---
        
        // 1. N = 4
        document.getElementById('box-n4').style.backgroundImage = createSimpleSvgBackground(4);

        // 2. N = 3
        document.getElementById('box-n3').style.backgroundImage = createSimpleSvgBackground(3);
    </script>

</body>
</html>
