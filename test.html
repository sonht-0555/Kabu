<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Rút Gọn</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
        }
        #start-button {
            padding: 10px 20px;
            margin-bottom: 30px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        /* Container (Đường ray) */
        .loading-line-container {
            width: 300px;
            height: 1px;
            background-color: #ddd;
            position: relative;
            overflow: hidden;
            /* Ẩn ban đầu */
            visibility: hidden; 
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* Hiển thị khi được kích hoạt */
        .loading-line-container.active {
            visibility: visible;
            opacity: 1;
        }
        /* Thanh loading (::after) */
        .loading-line-container::after {
            content: '';
            position: absolute;
            top: 0;
            width: 80px;
            height: 100%;
            background-color: #007bff;
            animation: none; /* Dừng animation ban đầu */
        }
        /* Kích hoạt animation khi có class 'active' */
        .loading-line-container.active::after {
            /* 2s: thời gian chạy, 1: chạy 1 lần, forwards: giữ trạng thái cuối */
            animation: moveLine 2s 1 cubic-bezier(0.4, 0.0, 0.2, 1) forwards; 
        }
        /* Keyframes: Di chuyển từ trái sang phải */
        @keyframes moveLine {
            0% { left: -80px; } 
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <button id="start-button">Bắt đầu Loading</button>
    <div id="loader" class="loading-line-container"></div>

    <script>
        const startButton = document.getElementById('start-button');
        const loader = document.getElementById('loader');

        function startLoading() {
            if (loader.classList.contains('active')) return; // Ngăn chạy kép

            startButton.disabled = true; // Vô hiệu hóa nút
            loader.classList.add('active'); // Bắt đầu animation

            // Lắng nghe sự kiện kết thúc animation (chỉ 1 lần)
            loader.addEventListener('animationend', handleAnimationEnd, { once: true });
        }

        function handleAnimationEnd() {
            // Loại bỏ class 'active' để ẩn loading
            loader.classList.remove('active');
            startButton.disabled = false; // Kích hoạt lại nút
            
            // Đặt lại vị trí của thanh loading về ban đầu bằng cách can thiệp CSS
            // để animation chạy lại đúng ở lần sau (giữ code gọn gàng)
            loader.style.setProperty('--reset-left', 'none'); // Reset
            
            // Đợi một chút rồi đặt lại để animation có thể chạy lại
            setTimeout(() => {
                loader.style.setProperty('--reset-left', 'initial');
            }, 50); 
        }

        // Gắn sự kiện click
        startButton.addEventListener('click', startLoading);
    </script>
</body>
</html>
