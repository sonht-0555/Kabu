<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Pointer Demo</title>
<style>
body {height:100vh;display:flex;justify-content:center;align-items:center;margin:0;font-family:sans-serif;}
.wrap {display:flex;gap:20px;}
.btn {
  width:140px;height:70px;background:#222;color:#fff;display:flex;justify-content:center;align-items:center;
  border-radius:12px;font-size:16px;user-select:none;touch-action:none;transition:.15s;
}
.btn.active {background:#444;}
</style>
</head>
<body>
<div class="wrap">
  <div id="up" class="btn">UP</div>
  <div id="down" class="btn">DOWN</div>
  <div id="left" class="btn">LEFT</div>
  <div id="right" class="btn">RIGHT</div>
  <div id="a" class="func">A</div>
  <div id="b" class="func">B</div>
  <div id="start" class="func">Start</div>
  <div id="select" class="func">Select</div>
</div>

<script>
const Main = {
  buttonPress(btn){ 
  console.log('Press', btn.id); 
  },
  buttonUnpress(btn){ 
  console.log('Unpress', btn.id); 
  }
};

let active = null;
function setActive(btn){
  if (active === btn) return;
  active && Main.buttonUnpress(active);
  active = btn;
  Main.buttonPress(btn);
}
function deactivate(){
  active && (Main.buttonUnpress(active), active = null);
}
addEventListener('pointerdown', e => {
  const btn = e.target.closest('.btn');
  btn && setActive(btn);
});
addEventListener('pointermove', e => {
  if (!active) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  el?.classList.contains('btn') && el !== active && setActive(el);
});
['pointerup','pointercancel'].forEach(t => addEventListener(t, deactivate));
</script>
</body>
</html>
