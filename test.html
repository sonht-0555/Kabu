<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipe Logic Minimal</title>
    <style>
        #control-box { position: relative; height: 100vh; }
    </style>
</head>
<body>
    <div id="control-box">
        <div id="value-display">Giá trị: 5</div>
    </div>
    <script>
        const valueDisplay = document.getElementById('value-display');
        let value = 5;
        let startY = 0, isSwiping = false;

        function updateDisplay() {
            valueDisplay.textContent = `Giá trị: ${value}`;
        }

        document.getElementById('control-box').addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSwiping = true;
            startY = e.touches[0].clientY;
        });

        document.getElementById('control-box').addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            e.preventDefault();
            const currentY = e.touches[0].clientY;
            const deltaY = startY - currentY;
            if (Math.abs(deltaY) >= 30) {
                let oldValue = value;
                if (deltaY > 0) value = Math.min(10, value + 1);
                else value = Math.max(0, value - 1);
                if (oldValue !== value) {
                    updateDisplay();
                    startY = currentY;
                }
            }
        });

        document.addEventListener('touchend', () => { isSwiping = false; });
        updateDisplay();
    </script>
</body>
</html>
