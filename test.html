<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Swipe Logic Readable</title>
    <style>
        /* c: controlBox, v: valueDisplay */
        #controlBox{width:300px;height:200px;border:1px solid #000;display:flex;justify-content:center;align-items:center;touch-action:none}
    </style>
</head>
<body>
    <div id="controlBox">
        <div id="valueDisplay">5</div>
    </div>
    <script>
        const controlBox=document.getElementById('controlBox'),valueDisplay=document.getElementById('valueDisplay');
        let value=5,startY=0,isSwiping=false;

        function updateDisplay(){valueDisplay.textContent=value;console.log(`[LOG] ${value}`)}

        controlBox.addEventListener('touchstart',t=>{
            const touchX=t.touches[0].clientX,boxRect=controlBox.getBoundingClientRect();
            if (touchX > (boxRect.right - 20) && touchX <= boxRect.right) {
                t.preventDefault();
                isSwiping=true;
                startY=t.touches[0].clientY;
                console.log("[LOG] Start");
            } else {isSwiping=false}
        });

        controlBox.addEventListener('touchmove',t=>{
            if(!isSwiping)return;
            t.preventDefault();
            const currentY=t.touches[0].clientY,deltaY=startY-currentY;
            if(Math.abs(deltaY)>=30){
                let oldValue=value;
                if(deltaY>0)value=Math.min(10,value+1);
                else value=Math.max(0,value-1);
                if(oldValue!==value){updateDisplay();startY=currentY}
            }
        });

        document.addEventListener('touchend',()=>{if(isSwiping)console.log("[LOG] End");isSwiping=false});

        updateDisplay();
    </script>
</body>
</html>
