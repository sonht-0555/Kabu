  <style>
    @import url('https://fonts.googleapis.com/css?family=Lato:100&display=swap');

body, html {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #5CA4EA;
  overflow: hidden;
  font-family: 'Lato', sans-serif;
}

.container {
  width: 400px;
  height: 400px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.center {
  width: 180px;
  height: 60px;
  position: absolute;
}

.btn {
    width: 180px;
    height: 60px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #91C9FF;
    outline: none;
    transition: 1s ease-in-out;
  }

  svg {
    position: absolute;
    left: 0;
    top: 0;
    fill: none;
    stroke: #fff;
    stroke-dasharray: 150 480;
    stroke-dashoffset: 150;
    transition: 1s ease-in-out;
  }

  /* replace hover rules with an 'active' state */
  .btn.active {
    background: #4F95DA;
  }

  .btn.active svg {
    stroke-dashoffset: -480;
  }

  .btn span {
    color: white;
    font-size: 18px;
    font-weight: 100;
  }

  </style>
<div class="container">
  <div class="center">
    <button class="btn">
      <svg width="180px" height="60px" viewBox="0 0 180 60" class="border">
        <polyline points="179,1 179,59 1,59 1,1 179,1" class="bg-line" />
        <polyline points="179,1 179,59 1,59 1,1 179,1" class="hl-line" />
      </svg>
      <span>CLICK ME</span>
    </button>
  </div>
</div>

<script>
  // prevent toggle while animation running
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.busy === '1') return; // đang chạy -> bỏ qua
      btn.dataset.busy = '1';
      const svg = btn.querySelector('svg');

      btn.classList.toggle('active');

      const cleanup = () => {
        btn.dataset.busy = '0';
        svg.removeEventListener('transitionend', onEnd);
        clearTimeout(fallback);
      };

      const onEnd = (e) => {
        if (e.propertyName === 'stroke-dashoffset') cleanup();
      };

      svg.addEventListener('transitionend', onEnd);
      // fallback nếu event không được gọi (timeout dài hơn transition)
      const fallback = setTimeout(cleanup, 1200);
    });
  });
</script>
